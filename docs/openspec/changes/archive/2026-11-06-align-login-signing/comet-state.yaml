            proposal: "Login signing: (1) per-request iOS identity for acc/login only (UA
              iLife798/3.1.9 (iPhone; iOS 17.0; Scale/3.00) iOS_ilife798_3.1.9,
              VersionCode 3.1.9, no ApplicationType); (2)
