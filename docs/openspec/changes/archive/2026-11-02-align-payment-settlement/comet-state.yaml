            proposal: "Technical design confirmed via brainstorming 2026-11-02: D1 remove
              the silent ptype=91→21 Alipay fallback entirely (no confirmation
              dialog); D2 map -52/-82/-88/-87 to actionable Chinese prompts in
              the existing pure prompt helper, -99 unchanged, unmapped codes
              pass through; D3 two-step bounded poll after settle — list
              /bill/lst-owner (type=91/status=3/cata=6, device+time filtered)
              then detail /bill/view-full for the promo.type=4 score-discount
              part, silent expiry instead of misreporting a fully score-covered
              bill as zero; D4 balance endpoints /acc/wallet/owner +
              /acc/score/acc-score with the existing token/headers, contingency
              adds ApplicationType 1,1 to those two requests only; D5 nullable
              balance state on the controller, home-page section only when
              logged in, degrades silently. Testing: parser/controller/widget
              layers incl. exactly-one-start-request assertion and scripted
              bill-availability timing, flutter analyze green, real-device
              integration check (tasks 5.2). Spec Patch: none. Approved by the
              user at comet-design Step 1c (AskUserQuestion: 确认本设计)."
