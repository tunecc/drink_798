            proposal: '在 HomeController.startDrinking 的设备预检之后、唯一启动请求之前,调用新增的
              DrinkApiService.setUseScore:POST acc/upt JSON body
              {"useScore":1},Content-Type application/json,仅 Authorization 头,无
              sign 无 ApplicationType(镜像 ilife798 参考,官方 iOS 无 ApplicationType
              字符串)。同步成功才发送 dev/start;任何同步失败(网络错误或服务端非零
              code)按用户确认的行为中止本次启动并展示专用提示,重试由用户发起;接管(设备忙)路径不发同步。不做自动重试(-98
              频控也按失败中止,可观察优先)。关键取舍:每次启动前同步而非登录时一次(服务端标志可被其他客户端改写,这正是当前回归的成因);失败中止而非警告继续(避免把当前
              bug 变成隐性复发)。风险与缓解:acc/upt 局部 body 可能影响其他账户字段→精确镜像参考 body
              并真机核验账户资料/余额不变;启动前多一次往返→单次用户动作可接受;标志在同步与结算间被外部翻转→窗口极小,接受。Spec
              Patch: 无(delta spec 已在 Open 确认)。测试策略:请求形状测试(方法/路径/body/头,断言无
              sign/ApplicationType)+ controller 测试(成功次序、失败中止、接管不同步)+ fvm flutter
              test 回归 + 真机验证抵扣链路。'
