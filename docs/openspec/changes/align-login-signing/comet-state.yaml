              its spec requirement; (5) longSign, device endpoints and global
              Android 3.1.8 headers unchanged; (6) score balance and settlement
              reads verified, not modified. Tests: signature vector
              93f9b2ec2c30df3ef4c8b9caeea3013b, mock-adapter request-shape
              assertions, live read check."
